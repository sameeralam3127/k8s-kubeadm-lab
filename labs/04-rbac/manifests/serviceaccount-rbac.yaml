# Lab 04 Task 2 - the canonical namespace-scoped RBAC trio.
#
# Read it as a sentence:
#   "Bind (RoleBinding) this identity (ServiceAccount) to these permissions (Role)."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader          # the IDENTITY - who is making the request
  namespace: lab04
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader          # the PERMISSIONS - what may be done, in this namespace
  namespace: lab04
rules:
  - apiGroups: [""]                 # "" is the core API group (pods, services, ...)
    resources: ["pods", "pods/log"] # sub-resources are named separately
    verbs: ["get", "list", "watch"] # note: no create/update/delete/patch
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Secrets are deliberately ABSENT. Reading secrets is close to cluster-admin,
  # because most secrets are credentials for something else.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding  # the GRANT - connects identity to permissions
  namespace: lab04
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: lab04
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role                # must be Role (or ClusterRole) - and it is immutable;
  name: pod-reader          # to point at a different role, delete and recreate.
