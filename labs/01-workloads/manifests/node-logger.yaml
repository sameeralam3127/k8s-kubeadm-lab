# Lab 01 Task 6 - a DaemonSet places exactly one pod on every eligible node.
# This is the shape every log shipper, node exporter and CNI agent uses.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-logger
  namespace: lab01
spec:
  selector:
    matchLabels:
      app: node-logger
  template:
    metadata:
      labels:
        app: node-logger
    spec:
      # Tolerate the control-plane taint so we land on EVERY node, which is the
      # whole point of a DaemonSet for observability agents.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: logger
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "$(date -Iseconds) node=${NODE_NAME} uptime=$(cut -d' ' -f1 /proc/uptime)s"
                sleep 30
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
