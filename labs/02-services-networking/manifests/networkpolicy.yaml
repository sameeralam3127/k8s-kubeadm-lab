# Lab 02 Task 5 - default-deny plus one targeted allow.
#
# Read these two objects together. The first makes every pod in the namespace
# refuse incoming traffic. The second punches a single hole in that wall.
# Policies are ADDITIVE: the union of all matching policies is what is allowed.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: lab02
spec:
  podSelector: {}            # {} means "every pod in this namespace"
  policyTypes:
    - Ingress                # only ingress is restricted; egress stays open
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-labelled-clients-to-backend
  namespace: lab02
spec:
  podSelector:
    matchLabels:
      app: backend           # this policy governs traffic INTO backend pods
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: backend   # only pods carrying access=backend may connect
      ports:
        - protocol: TCP
          port: 8080
