# Lab 03 Task 4 - configuration and credentials, mounted and injected.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: lab03
data:
  app.properties: |
    mode=production
    replicas=3
  APP_MODE: production
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: lab03
type: Opaque
stringData:
  # stringData takes plaintext and base64-encodes it for you on the way in.
  # It is ENCODING, not encryption - anyone with read access can decode it.
  password: "s3cr3t-lab-password"
  api-key: "lab-api-key-0000"
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  namespace: lab03
spec:
  volumes:
    - name: config
      configMap:
        name: app-config
        items:
          - key: app.properties
            path: app.properties
    - name: secret
      secret:
        secretName: app-secret
        defaultMode: 0400        # read-only to the owner
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "infinity"]
      env:
        # Injected as env vars: captured at container START. Changing the
        # ConfigMap later will NOT update these until the pod restarts.
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_MODE
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: password
      volumeMounts:
        # Mounted as files: the kubelet refreshes these in place, so edits to
        # the ConfigMap show up (within a minute) without a restart.
        - name: config
          mountPath: /etc/app
          readOnly: true
        - name: secret
          mountPath: /etc/secret
          readOnly: true
      resources:
        requests: { cpu: 10m, memory: 16Mi }
