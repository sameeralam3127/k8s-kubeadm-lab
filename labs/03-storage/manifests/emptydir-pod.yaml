# Lab 03 Task 2 - the sidecar pattern: two containers sharing one emptyDir.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
  namespace: lab03
spec:
  volumes:
    - name: shared
      emptyDir: {}        # created empty when the Pod starts, deleted with it
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - 'while true; do echo "$(date -Iseconds) tick" >> /shared/feed.log; sleep 5; done'
      volumeMounts:
        - name: shared
          mountPath: /shared
      resources:
        requests: { cpu: 10m, memory: 16Mi }
    - name: reader
      image: busybox:1.36
      # The classic log-shipper sidecar: it only reads what the app writes.
      command: ["/bin/sh", "-c", "tail -F /shared/feed.log"]
      volumeMounts:
        - name: shared
          mountPath: /shared
          readOnly: true
      resources:
        requests: { cpu: 10m, memory: 16Mi }
