<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="k8s-kubeadm-lab: a complete, reproducible Kubernetes lab toolkit">
  <title>k8s-kubeadm-lab</title>
  <desc>A complete, reproducible Kubernetes lab toolkit for building a multi-node kubeadm cluster across a Mac and a Windows machine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="55%" stop-color="#12263f"/>
      <stop offset="100%" stop-color="#1b3a5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#326ce5"/>
      <stop offset="100%" stop-color="#5aa9e6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="4" rx="2" fill="url(#accent)"/>

  <!-- Kubernetes-style heptagon mark -->
  <g transform="translate(120 150)">
    <polygon points="0,-58 50,-36 62,17 28,55 -28,55 -62,17 -50,-36"
             fill="none" stroke="#5aa9e6" stroke-width="3" opacity="0.85"/>
    <polygon points="0,-30 26,-19 32,9 15,28 -15,28 -32,9 -26,-19"
             fill="#326ce5" opacity="0.30"/>
    <g stroke="#8ec5f0" stroke-width="2" opacity="0.75">
      <line x1="0" y1="-30" x2="0" y2="-58"/>
      <line x1="26" y1="-19" x2="50" y2="-36"/>
      <line x1="32" y1="9"  x2="62" y2="17"/>
      <line x1="15" y1="28" x2="28" y2="55"/>
      <line x1="-15" y1="28" x2="-28" y2="55"/>
      <line x1="-32" y1="9" x2="-62" y2="17"/>
      <line x1="-26" y1="-19" x2="-50" y2="-36"/>
    </g>
    <circle cx="0" cy="0" r="7" fill="#5aa9e6"/>
  </g>

  <text x="235" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="52" font-weight="700" fill="#ffffff">k8s-kubeadm-lab</text>
  <text x="237" y="158" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="21" fill="#a8c7e8">A complete, reproducible Kubernetes lab toolkit</text>
  <text x="237" y="188" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" fill="#7ba3cc">Build a real multi-node cluster across a Mac and a Windows machine, then break it on purpose.</text>

  <!-- feature chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <g transform="translate(237 214)">
      <rect width="132" height="30" rx="15" fill="#326ce5" opacity="0.22" stroke="#5aa9e6" stroke-width="1"/>
      <text x="66" y="20" text-anchor="middle" fill="#a8c7e8">kubeadm</text>
    </g>
    <g transform="translate(381 214)">
      <rect width="150" height="30" rx="15" fill="#326ce5" opacity="0.22" stroke="#5aa9e6" stroke-width="1"/>
      <text x="75" y="20" text-anchor="middle" fill="#a8c7e8">etcd backup / DR</text>
    </g>
    <g transform="translate(543 214)">
      <rect width="112" height="30" rx="15" fill="#326ce5" opacity="0.22" stroke="#5aa9e6" stroke-width="1"/>
      <text x="56" y="20" text-anchor="middle" fill="#a8c7e8">7 labs</text>
    </g>
    <g transform="translate(667 214)">
      <rect width="176" height="30" rx="15" fill="#326ce5" opacity="0.22" stroke="#5aa9e6" stroke-width="1"/>
      <text x="88" y="20" text-anchor="middle" fill="#a8c7e8">bash + PowerShell</text>
    </g>
    <g transform="translate(855 214)">
      <rect width="150" height="30" rx="15" fill="#326ce5" opacity="0.22" stroke="#5aa9e6" stroke-width="1"/>
      <text x="75" y="20" text-anchor="middle" fill="#a8c7e8">CKA practice</text>
    </g>
  </g>

  <!-- terminal snippet -->
  <g transform="translate(950 60)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect width="212" height="118" rx="8" fill="#08121d" stroke="#2a4a70" stroke-width="1"/>
    <circle cx="18" cy="18" r="4.5" fill="#ff5f57"/>
    <circle cx="34" cy="18" r="4.5" fill="#febc2e"/>
    <circle cx="50" cy="18" r="4.5" fill="#28c840"/>
    <text x="16" y="52" fill="#5aa9e6">$ ./lab up</text>
    <text x="16" y="74" fill="#7fd88f">  [ok] k8s-cp    Ready</text>
    <text x="16" y="94" fill="#7fd88f">  [ok] worker1   Ready</text>
    <text x="16" y="112" fill="#8899aa">  cluster ready.</text>
  </g>
</svg>
